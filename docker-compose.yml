services:
  chick-n-cow:
    build: .
    image: chick-n-cow
    container_name: chick-n-cow
    restart: unless-stopped
    ports:
      # HOST_IP=127.0.0.1 keeps the port private to the server (e.g. behind a Cloudflare Tunnel)
      - "${HOST_IP:-0.0.0.0}:${PORT:-8081}:3000"
    volumes:
      # Cards (including ones added from the settings page) live here and survive rebuilds
      - cards:/app/cards
      # Swap the sounds without rebuilding: uncomment to use the sound/ folder from this repo
      # - ./sound:/app/sound:ro

volumes:
  cards:
